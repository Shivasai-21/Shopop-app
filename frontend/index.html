<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>ShopOps</title>
<style>body{font-family:sans-serif;max-width:640px;margin:2rem auto}li{margin:.5rem 0}#msg{color:#06c}</style></head>
<body><h1>ShopOps Catalog</h1><ul id="list"></ul><p id="msg"></p>
<script>
async function load(){
  const r = await fetch('/api/products'); const items = await r.json();
  document.getElementById('list').innerHTML = items.map(p =>
    `<li>${p.name} - $${p.price} (stock ${p.stock}) <button onclick="buy(${p.id})">Buy 1</button></li>`).join('');
}
async function buy(id){
  const r = await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({productId:id,quantity:1})});
  document.getElementById('msg').textContent = r.ok ? 'Order placed! Request-Id: '+r.headers.get('X-Request-Id')
                                                     : 'Failed: HTTP '+r.status;
  load();
}
load();
</script></body></html>
