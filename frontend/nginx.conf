server {
  listen 80;
  location /api/ {
    proxy_pass http://backend:8080;          # "backend" = compose service / k8s Service name
    proxy_set_header X-Request-Id $request_id; # trace id starts at the edge
    proxy_connect_timeout 2s;
  }
  location / { root /usr/share/nginx/html; index index.html; }
}
}
