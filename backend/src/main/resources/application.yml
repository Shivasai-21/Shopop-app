# 12-factor: every environment-specific value comes from an env var (with a local default)
server:
  port: 8080
  shutdown: graceful                 # finish in-flight requests on SIGTERM (rolling updates!)
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate             # schema is owned by Flyway, never by Hibernate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true                # /actuator/health/liveness and /readiness for Kubernetes
notification:
  url: ${NOTIFICATION_URL:}          # empty = Day-2 service not added yet
chaos:
  enabled: ${CHAOS_ENABLED:false}
logging:
  pattern:
    level: "%5p [req=%X{requestId}]" # every log line carries the request id
